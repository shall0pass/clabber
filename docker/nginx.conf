server {
    listen       80;
    listen  [::]:80;
    server_name  _;

    root   /usr/share/nginx/html;
    index  index.html;

    # gzip the text assets (nginx:alpine has gzip built in).
    gzip            on;
    gzip_types      text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Content-hashed build output — safe to cache forever.
    location /_app/immutable/ {
        access_log off;
        expires    1y;
        add_header  Cache-Control "public, immutable";
    }

    # Card art and other files under static/.
    location /cards/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # Join-code registry — served by the sync-server container (its Automerge
    # relay ignores non-WebSocket routes and handles /games/:code).
    location /games/ {
        proxy_pass http://sync:3030;
        proxy_set_header Host $host;
    }

    # Single-page app: any unknown path serves the shell so the client-side
    # router can take over (adapter-static was built with fallback: index.html).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
